name: avatar_analytics_app
description: SNS Analytics Dashboard for AI Avatar Management
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # UI Components
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  lucide_icons: ^0.257.0
  
  # Charts
  fl_chart: ^0.66.0
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.3.1
  url_launcher: ^6.2.4
  
  # HTTP for API calls
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true